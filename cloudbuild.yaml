steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull europe-west2-docker.pkg.dev/fpl-analytics-488811/fpl-analytics-artifacts/fpl-data-loader:latest || exit 0']

  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'europe-west2-docker.pkg.dev/fpl-analytics-488811/fpl-analytics-artifacts/fpl-data-loader:latest'
      - '--cache-from'
      - 'europe-west2-docker.pkg.dev/fpl-analytics-488811/fpl-analytics-artifacts/fpl-data-loader:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west2-docker.pkg.dev/fpl-analytics-488811/fpl-analytics-artifacts/fpl-data-loader:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'fpl-data-loader'
      - '--image'
      - 'europe-west2-docker.pkg.dev/fpl-analytics-488811/fpl-analytics-artifacts/fpl-data-loader:latest'
      - '--region'
      - 'europe-west2'
      - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'fpl-data-loader'
      - '--image'
      - 'europe-west2-docker.pkg.dev/fpl-analytics-488811/fpl-analytics-artifacts/fpl-data-loader:latest'
      - '--region'
      - 'europe-west2'
      - '--project'
      - '$fpl-analytics-488811'

options:
  logging: CLOUD_LOGGING_ONLY